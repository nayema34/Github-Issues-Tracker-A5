<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | GitHub Issues Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/0398fc8d82.js" crossorigin="anonymous"></script>
</head>

<body class="bg-gray-50 min-h-screen">

    <nav
        class="navbar bg-base-100 shadow-lg w-[95%] mx-auto mt-4 rounded-lg flex flex-col md:flex-row items-center justify-between p-4 gap-4">
        <div class="logo flex items-center gap-3">
            <img class="h-9 w-9" src="./assets/github-logo.png" alt="GitHub Logo">
            <h1 class="text-xl md:text-2xl font-semibold text-gray-800">GitHub Issues Tracker</h1>
        </div>

        <div class="flex items-center gap-3 w-full md:w-auto">
            <div class="relative w-full md:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="query-input" placeholder="Search issues..."
                    class="input input-bordered pl-10 w-full focus:outline-primary border-gray-200" />
            </div>
            <button id="execute-search" class="btn btn-primary px-6">Search</button>
        </div>
    </nav>

    <div class="main w-[95%] lg:w-10/12 xl:w-9/12 mt-10 mx-auto pb-20">

        <div id="filter-tab-group" class="tab flex items-center justify-start gap-3 overflow-x-auto no-scrollbar py-2">
            <button class="btn btn-primary min-w-[100px]">All</button>
            <button class="btn min-w-[100px] bg-white border-gray-200">Open</button>
            <button class="btn min-w-[100px] bg-white border-gray-200">Closed</button>
        </div>

        <div class="mt-10 flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
            <div class="left flex items-center gap-4">
                <img src="./assets/Aperture.png" class="w-12 h-12" alt="Icon">
                <div>
                    <p class="text-2xl font-bold text-gray-800"><span id="total-issue-ticker">0</span> Issues</p>
                    <p class="text-gray-500">Track and manage your project issues</p>
                </div>
            </div>

            <div class="right flex items-center gap-6">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 bg-[#00A96E] rounded-full"></div>
                    <span class="font-medium text-gray-700">Open</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 bg-[#A855F7] rounded-full"></div>
                    <span class="font-medium text-gray-700">Closed</span>
                </div>
            </div>
        </div>

        <div id="issue-gallery"
            class="issues mt-10 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 min-h-[300px] relative">
        </div>
    </div>

    <input type="checkbox" id="details-view-trigger" class="modal-toggle" />
    <div class="modal" role="dialog">
        <div class="modal-box max-w-2xl p-6 md:p-10 rounded-3xl relative">
            <h3 id="view-title" class="text-3xl font-bold text-gray-900 leading-tight"></h3>

            <div class="flex flex-wrap items-center gap-3 mt-5 text-gray-500 font-medium border-b pb-6">
                <span id="view-status-badge" class="px-4 py-1 rounded-full text-white text-sm capitalize"></span>
                <span>•</span>
                <span id="view-meta-info"></span>
            </div>

            <div id="view-tags-list" class="flex flex-wrap gap-2 mt-6"></div>

            <div class="mt-6 text-gray-600 leading-relaxed text-lg">
                <p id="view-body-text"></p>
            </div>

            <div
                class="mt-10 p-6 bg-slate-50 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border border-gray-100">
                <div>
                    <p class="text-gray-400 font-bold mb-1 uppercase tracking-widest text-xs">Assignee</p>
                    <p id="view-user-assigned" class="text-xl font-extrabold text-gray-800"></p>
                </div>
                <div class="sm:text-right">
                    <p class="text-gray-400 font-bold mb-1 uppercase tracking-widest text-xs">Priority</p>
                    <span id="view-priority-level" class="px-6 py-1.5 rounded-lg text-white font-bold inline-block"></span>
                </div>
            </div>

            <div class="modal-action mt-8">
                <label for="details-view-trigger" class="btn btn-primary px-10 rounded-xl border-none">Close</label>
            </div>
        </div>
        <label class="modal-backdrop" for="details-view-trigger">Close</label>
    </div>

    <script src="home.js"></script>
</body>

</html>
